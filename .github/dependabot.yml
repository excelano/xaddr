# Dependabot keeps Cargo and GitHub Actions dependencies current so security
# fixes show up as PRs rather than slipping past.
#
# Each ecosystem's bumps are grouped into a single weekly PR so they share one
# lockfile change instead of stacking conflicting updates.
#
# The cargo entry has nothing to do today — xaddr has no dependencies, deliberately — and is
# here so that stops being true loudly rather than quietly if one is ever added.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

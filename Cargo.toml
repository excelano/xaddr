[package]
name = "xaddr"
homepage = "https://excelano.com/xaddr/"
version = "0.2.1"
edition = "2021"
# Measured, not inferred: 1.65 builds and passes the suite, 1.64 fails on the
# `let ... else` in parse.rs. Edition 2021 would only imply 1.56, which is a
# floor on the edition rather than on this code. Checked by the msrv job in
# ci.yml — a declared minimum nothing tests rots the same way a version peg does.
rust-version = "1.65"
description = "spreadsheet-style addressing for tabular data — column letters, [bracketed names], rows, cells, and ranges"
license = "MIT"
authors = ["David M. Anderson"]
repository = "https://github.com/excelano/xaddr"
readme = "README.md"
keywords = ["csv", "tabular", "spreadsheet", "address", "range"]
categories = ["parser-implementations", "text-processing"]

# No dependencies, deliberately. This crate is linked by CLIs and by a GTK
# application; it parses and resolves text and must never pull a tree behind it.
# Empty, deliberately: this crate is addressing and nothing else, and a
# dependency appearing here is a change worth noticing rather than a detail.
[dependencies]
